<h2>1.クロワッサン</h2>
<h3>一口食べれば、幸せ広がる贅沢クロワッサン！</h3>
<p>焼きたての香ばしいバターの香りがふわっと広がる、贅沢なクロワッサン。一口かじれば<strong>「サクッ！」</strong>と
心地よい音が響き、中からはふんわり、しっとりとした生地のおいしさが広がります。何層にも重なった記事と、口いっぱいに
広がる濃厚なバターの風味は、まさに至福の味わい。思わずもう一つ食べたくなるおいしさです。毎日の朝食をちょっと特別にする
クロワッサンをぜひご賞味ください！</p>
